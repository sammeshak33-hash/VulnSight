[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnsight"
version = "0.1.0"
description = "Hybrid AI-based code vulnerability detection and severity assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[project.scripts]
vulnsight = "vulnsight.cli:main"

[tool.setuptools.packages.find]
include = ["vulnsight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.setuptools.package-data]
"vulnsight.cwe" = ["catalog.json"]
"vulnsight.ui" = ["static/*"]